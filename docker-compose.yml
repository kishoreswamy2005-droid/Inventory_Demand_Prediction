services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_demand
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_demand"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env}
      DATABASE_URL: postgresql+psycopg2://inventory:${POSTGRES_PASSWORD:-inventory}@db:5432/inventory_demand
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      AUTO_SEED_DATASET: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MODEL_PATH: /artifacts/inventory_demand_model.pkl
      DATASET_PATH: /dataset/retail_store_inventory.csv
    volumes:
      # Supplied artifacts are mounted read-only, never overwritten by the image.
      - ./inventory_demand_model.pkl:/artifacts/inventory_demand_model.pkl:ro
      - ./dataset:/dataset:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
